name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: pip install uv && uv sync --frozen --dev

      - name: Ruff lint
        run: uv run ruff check backend/

      - name: Pytest backend
        run: uv run pytest backend/tests

  docs-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify stale script references are removed
        run: |
          ! rg -n "verify_pipeline\.py|download_finbert\.py" README.md backend/data/README.md .vscode/launch.json
