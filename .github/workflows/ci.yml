name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        run: uv sync --frozen --dev

      - name: Ruff lint
        run: uv run ruff check backend/ evals/

      - name: Ruff format
        run: uv run ruff format --check backend/ evals/

      - name: Mypy
        run: uv run mypy backend/

      - name: Benchmark integrity
        run: PYTHONPATH=. uv run python -m evals.validate

      - name: Adversarial manifest integrity
        run: PYTHONPATH=backend:. uv run python -m evals.adversarial

      - name: CLI smoke (installed entry point)
        run: uv run finai --help

      - name: Offline experiment CLI smoke
        run: uv run python -m experiments --help

      - name: Pytest with coverage (production code only)
        run: uv run pytest backend/tests --cov=backend --cov-report=term-missing --cov-fail-under=70

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Export locked requirements
        run: uv export --frozen --no-dev --no-emit-project -o requirements-audit.txt

      - name: pip-audit
        run: uvx pip-audit --disable-pip --no-deps -r requirements-audit.txt

  docs-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify stale script references are removed
        run: |
          ! rg -n "verify_pipeline\.py|download_finbert\.py" README.md backend/data/README.md .vscode/launch.json
