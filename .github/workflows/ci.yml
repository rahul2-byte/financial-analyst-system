name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: pip install uv && uv sync --frozen --dev

      - name: Ruff lint
        run: uv run ruff check backend/ evals/

      - name: Mypy
        run: uv run mypy backend/

      - name: Benchmark integrity
        run: PYTHONPATH=. uv run python -m evals.validate

      - name: Adversarial manifest integrity
        run: PYTHONPATH=backend:. uv run python -m evals.adversarial

      - name: Evaluation support checks
        run: >-
          PYTHONPATH=backend:. uv run pytest
          backend/tests/unit/test_eval_numeric.py
          backend/tests/unit/test_eval_support.py
          backend/tests/unit/test_eval_stage_metrics.py
          backend/tests/unit/test_adversarial_assertions.py
          --no-cov

      - name: CLI smoke
        run: PYTHONPATH=backend uv run python -m finai --help

      - name: Offline experiment CLI smoke
        run: PYTHONPATH=backend uv run python -m experiments --help

      - name: Pytest backend
        run: uv run pytest backend/tests --no-cov

      - name: Coverage threshold
        run: uv run pytest backend/tests --cov=backend --cov-report=term-missing --cov-fail-under=70

  docs-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify stale script references are removed
        run: |
          ! rg -n "verify_pipeline\.py|download_finbert\.py" README.md backend/data/README.md .vscode/launch.json
