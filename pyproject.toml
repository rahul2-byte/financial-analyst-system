[project]
name = "financial-analyst-system"
version = "0.1.0"
description = "Evidence-grounded financial research system"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi",
    "httpx",
    "opentelemetry-api>=1.28,<2",
    "numpy",
    "pandas",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "pymupdf",
    "pyyaml",
    "rich",
    "trafilatura",
    "textual>=0.70.0",
    "uvicorn",
    "yfinance",
    "TA-Lib>=0.6.5,<0.7",
    "pandas-ta-classic>=0.6.5,<0.7",
]

[project.scripts]
finai = "finai.__main__:main"

[project.optional-dependencies]
# Nothing in the runtime imports vectorbt; install only for ad-hoc backtesting.
backtest = ["vectorbt>=1.1,<1.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "backend/finai",
    "backend/app",
    "backend/data",
    "backend/quant",
    "backend/experiments",
    "backend/skills",
]

[tool.hatch.build.targets.sdist]
include = ["backend", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff>=0.16,<0.17",
]
observability = [
    "arize-phoenix-otel==0.17.1",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
    "opentelemetry-instrumentation-httpx>=0.49b0,<1",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
addopts = "--cov=backend --cov-report=term-missing --cov-fail-under=70"
markers = ["live: test may open real network connections"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "*/tests/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# TODO: backend/data/** is being edited elsewhere; replace with contextlib.suppress later.
"backend/data/providers/yfinance.py" = ["SIM105"]
# Tests stub modules in sys.modules before importing the module under test.
"backend/tests/unit/test_yfinance_ticker_formatting.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["evals.*"]
allow_redefinition = true
disable_error_code = ["no-redef"]
