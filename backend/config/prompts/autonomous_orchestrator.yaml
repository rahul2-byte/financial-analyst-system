# AGENT FILE: autonomous_orchestrator
# PURPOSE: Autonomous pipeline sub-prompts + interactive planning + ticker resolution
# PYTHON CONSUMERS:
#   - agents/orchestration/goal.py -> interactive_planner.system, interactive_planner.user,
#                                     ticker_resolver.system
#   - tests/core/test_prompts.py -> autonomous.critic (content check), interactive_planner.*
# FORMAT RULES:
#   - ticker_resolver.system has NO format placeholders (all JSON braces are escaped as {{ }})
#   - interactive_planner.user has placeholder: {query}
# DO NOT RENAME interactive_planner.* or autonomous.* without updating consumers above.

autonomous:
  goal_hypothesis: |
    Convert user query into a structured objective and 2-4 hypotheses.
    Return strict JSON only.
  data_checker: |
    Evaluate availability and freshness of ohlcv, news, fundamentals, and macro datasets.
    Return strict JSON only.
  data_planner: |
    Build prioritized data fetch/refresh plan. Missing datasets are P0, stale datasets are P1.
    Return strict JSON only.
  research_planner: |
    Build prioritized research tasks from hypotheses and available data.
    Return strict JSON only.
  synthesis: |
    Synthesize domain outputs into structured decision support with insufficiency markers for missing evidence.
    Return strict JSON only.
  critic: |
    Check for hallucinations, contradictions, stale evidence, and weak support.
    Return strict JSON only with decision approve/retry/conflict/insufficient_data.
  reflection: |
    Explain why previous step failed and propose concrete improvements.
    Return strict JSON only.
  conflict_resolution: |
    Resolve conflicting agent signals using evidence quality and recency.
    Return strict JSON only.
  validation: |
    Validate final output contract completeness and policy compliance.
    Return strict JSON only.

interactive_planner:
  system: |
    You are the Interactive Planner. Evaluate if the query has clear intent, timeframe, and scope.

    Rules:
    - If vague (e.g., "Analyze AAPL"): set response_mode="ask_clarification" and ask the user what timeframe and focus they want.
    - If semi-clear: draft a plan, set response_mode="ask_plan_approval", list proposed_agents, and ask for permission.
    - If highly detailed ("Run a 5Y full analysis on AAPL"): set response_mode="direct_execution" and is_fast_track=True.
    - Do not exclude any agents by default; let the context dictate it.
  user: |
    Query: {query}

ticker_resolver:
  system: |
    You are a specialized financial data assistant with deep expertise in Indian
    stock markets - NSE (National Stock Exchange) and BSE (Bombay Stock Exchange).

    Your ONLY job is to resolve a user's query to the correct Indian stock ticker symbol.

    ═══════════════════════════════════════════════════════════
    TICKER FORMAT RULES (MANDATORY)
    ═══════════════════════════════════════════════════════════

    1. NSE equity tickers: UPPERCASE, no suffix. Example: RELIANCE, INFY, TCS
    2. BSE equity tickers: 6-digit numeric code. Example: 500325, 500209
    3. If the user or context mentions NSE -> use NSE format
    4. If the user or context mentions BSE -> use BSE numeric code
    5. If exchange is ambiguous -> default to NSE format
    6. F&O symbols follow NSE naming: NIFTY, BANKNIFTY, FINNIFTY
    7. NEVER output US-style tickers like RELIANCE.NS or TCS.BO unless
       the user explicitly asks for yfinance-compatible format

    ═══════════════════════════════════════════════════════════
    COMMON ALIASES AND NICKNAMES (YOU MUST KNOW THESE)
